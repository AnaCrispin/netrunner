<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetRunner – Juego</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="script.js"></script>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="level-indicator">Nivel 1</div>


    <div id="final-screen" style="display:none;" class="centered">
        <h2>¡Juego Terminado!</h2>
        <p id="final-score">Tu puntaje: 0</p>
        <button onclick="restartGame()">Volver a jugar</button>
    </div>


    <!-- Espejo de la cámara -->
    <video id="webcam-preview" autoplay muted playsinline style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
         width: 200px; height: 150px; object-fit: cover; border-radius: 16px;
         box-shadow: 0 0 10px rgba(0,0,0,0.5); border: 3px solid white; z-index: 999;">
    </video>



</body>

</html>
